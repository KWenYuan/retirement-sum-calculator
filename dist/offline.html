<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retirement Projection Studio Offline</title>
    <style>
      :root {
        color: #172033;
        background: #f4f6f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 560px;
        padding: 28px;
        border: 1px solid #dfe6ef;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 18px 44px rgba(16, 42, 76, 0.12);
      }

      img {
        width: auto;
        max-width: 88px;
        max-height: 56px;
        object-fit: contain;
      }

      h1 {
        margin: 18px 0 8px;
        color: #102a4c;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #667085;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Advisor logo" />
      <h1>You are offline</h1>
      <p>You are offline. Please reconnect once to update the app.</p>
    </main>
  </body>
</html>
